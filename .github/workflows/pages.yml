name: Publicar Blossom Brew Lab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml
    with:
      require_cloud: true

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_version: ${{ steps.version.outputs.value }}
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer la versión que se va a publicar
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          with open('package.json') as source:
              version = json.load(source)['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'value={version}\n')
          PY
      - name: Preparar solo los archivos de la aplicación
        env:
          BLOSSOM_SUPABASE_URL: ${{ vars.BLOSSOM_SUPABASE_URL }}
          BLOSSOM_SUPABASE_PUBLISHABLE_KEY: ${{ vars.BLOSSOM_SUPABASE_PUBLISHABLE_KEY }}
        run: python scripts/prepare_pages.py
      - name: Leer la configuración de GitHub Pages
        uses: actions/configure-pages@v5
      - name: Guardar el sitio para su publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comprobar la versión y la conexión publicadas
        env:
          BLOSSOM_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          BLOSSOM_APP_VERSION: ${{ needs.build.outputs.app_version }}
          BLOSSOM_SUPABASE_URL: ${{ vars.BLOSSOM_SUPABASE_URL }}
          BLOSSOM_SUPABASE_PUBLISHABLE_KEY: ${{ vars.BLOSSOM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python3 -u - <<'PY'
          import os
          import time
          from urllib.request import urlopen
          from urllib.parse import urljoin
          site = os.environ['BLOSSOM_SITE_URL'].rstrip('/') + '/'
          version = os.environ['BLOSSOM_APP_VERSION']
          expected_url = os.environ['BLOSSOM_SUPABASE_URL'].strip().rstrip('/')
          expected_key = os.environ['BLOSSOM_SUPABASE_PUBLISHABLE_KEY'].strip()
          for attempt in range(12):
              try:
                  stamp = str(time.time_ns())
                  with urlopen(site + '?verify=' + stamp, timeout=20) as response:
                      html = response.read().decode()
                  if 'id="cloudAccount"' not in html or f'src/cloud-api.js?v={version}' not in html:
                      raise ValueError('La página todavía no muestra la nueva versión')
                  with urlopen(urljoin(site, 'src/cloud-config.js') + '?verify=' + stamp, timeout=20) as response:
                      config = response.read().decode()
                  if expected_url not in config or expected_key not in config:
                      raise ValueError('La configuración pública todavía no coincide con el proyecto')
                  with urlopen(urljoin(site, 'concepto/') + '?verify=' + stamp, timeout=20) as response:
                      preview = response.read().decode()
                  if 'data-design-preview="blossom-editorial"' not in preview:
                      raise ValueError('La propuesta visual todavía no está disponible')
                  with urlopen(urljoin(site, 'recetario/') + '?verify=' + stamp, timeout=20) as response:
                      catalogue = response.read().decode()
                  if 'data-public-catalogue="blossom"' not in catalogue or f'src/catalogue-ui.js?v={version}' not in catalogue:
                      raise ValueError('El recetario público todavía no muestra la nueva versión')
                  with urlopen(urljoin(site, 'supabase/migrations/202611110001_public_catalogue.sql') + '?verify=' + stamp, timeout=20) as response:
                      activation = response.read().decode()
                  if 'create table if not exists public.blossom_publishers' not in activation:
                      raise ValueError('La configuración de activación no está disponible')
                  with urlopen(urljoin(site, 'supabase/migrations/202611110002_pour_steps.sql') + '?verify=' + stamp, timeout=20) as response:
                      instructions = response.read().decode()
                  if 'blossom_project_pour_steps' not in instructions:
                      raise ValueError('La actualización de indicaciones no está disponible')
                  with urlopen(urljoin(site, 'supabase/migrations/202611110003_usage_statistics.sql') + '?verify=' + stamp, timeout=20) as response:
                      statistics = response.read().decode()
                  if 'blossom_usage_summary' not in statistics or 'analyticsTab' not in html or f'src/analytics.js?v={version}' not in catalogue:
                      raise ValueError('La configuración de estadísticas no está disponible')
                  for asset, signature in [('assets/images/coffee-blossoms.png', b'\x89PNG\r\n\x1a\n'),
                                           ('assets/fonts/manrope.woff2', b'wOF2'),
                                           ('concepto/assets/coffee-blossoms.png', b'\x89PNG\r\n\x1a\n'),
                                           ('concepto/assets/fonts/manrope.woff2', b'wOF2')]:
                      with urlopen(urljoin(site, asset) + '?verify=' + stamp, timeout=20) as response:
                          if response.read(len(signature)) != signature:
                              raise ValueError('Un recurso visual no está disponible')
                  print(f'Versión {version} publicada y configuración de Supabase verificada.')
                  print('Aplicación y propuesta visual: fotografía y tipografía publicadas y verificadas.')
                  print('Página del recetario público y configuración de activación publicadas y verificadas.')
                  break
              except Exception as error:
                  if attempt == 11:
                      print(f'::error::No se pudo comprobar la publicación: {error}')
                      raise SystemExit(1)
                  print('Esperando la actualización de GitHub Pages…')
                  time.sleep(5)
          PY
