name: Pruebas de Blossom Brew Lab

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Probar cálculos, almacenamiento y respaldos
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas de prueba
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Probar la aplicación en Chromium
        run: python -m unittest discover -s tests -p 'test_browser.py' -v
