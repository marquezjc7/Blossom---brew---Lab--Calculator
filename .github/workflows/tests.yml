name: Pruebas de Blossom Brew Lab

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BLOSSOM_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Probar cálculos, almacenamiento y respaldos
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas de prueba
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Probar la aplicación en el navegador seleccionado
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          if suite.countTestCases() == 0:
              raise SystemExit('No se encontraron pruebas de navegador')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for case, trace in result.failures + result.errors:
              message = trace.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
              print(f'::error title={case.id()}::{message}', flush=True)
          raise SystemExit(not result.wasSuccessful())
          PY
