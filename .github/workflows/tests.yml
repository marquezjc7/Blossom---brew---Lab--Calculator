name: Pruebas de Blossom Brew Lab

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:
    inputs:
      require_cloud:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  cloud:
    if: inputs.require_cloud || vars.BLOSSOM_SUPABASE_URL != '' || vars.BLOSSOM_SUPABASE_PUBLISHABLE_KEY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar Supabase y los permisos de acceso
        env:
          BLOSSOM_SUPABASE_URL: ${{ vars.BLOSSOM_SUPABASE_URL }}
          BLOSSOM_SUPABASE_PUBLISHABLE_KEY: ${{ vars.BLOSSOM_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python scripts/check_cloud.py
          python scripts/check_public_catalogue.py
          python scripts/check_usage_statistics.py

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BLOSSOM_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Probar cálculos, almacenamiento y respaldos
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas de prueba
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r requirements-dev.txt
      - name: Conservar descargas de los navegadores de prueba
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ matrix.browser }}-playwright-${{ hashFiles('requirements-dev.txt') }}
      - name: Instalar bibliotecas del navegador
        timeout-minutes: 7
        run: python -m playwright install-deps ${{ matrix.browser }}
      - name: Descargar el navegador de prueba
        if: steps.browser-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: python -m playwright install ${{ matrix.browser }}
      - name: Probar la aplicación en el navegador seleccionado
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          if suite.countTestCases() == 0:
              raise SystemExit('No se encontraron pruebas de navegador')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for case, trace in result.failures + result.errors:
              message = trace.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
              print(f'::error title={case.id()}::{message}', flush=True)
          raise SystemExit(not result.wasSuccessful())
          PY
