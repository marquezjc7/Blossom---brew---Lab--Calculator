name: Diagnose public mobile layout in WebKit
on:
  push:
    branches: [codex/public-layout-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BLOSSOM_BROWSER: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps webkit
      - run: |
          python - <<'PY'
          import sys, unittest
          sys.path.insert(0,'tests')
          from test_browser import BrowserTests
          suite=unittest.TestSuite([BrowserTests('test_public_catalogue_all_sections_fit_mobile_and_intro_copy_is_removed')])
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          for case,trace in result.failures+result.errors:
              message=trace.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A')
              print(f'::error title={case.id()}::{message}',flush=True)
          raise SystemExit(not result.wasSuccessful())
          PY
